name: Build do executável Windows

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependências
        run: |
          pip install -r requirements-client.txt
          pip install pyinstaller

      - name: Gera o .exe
        run: pyinstaller ControllerMachine.spec

      - name: Anexa o .exe à release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/ControllerMachine.exe --clobber

      - name: Publica o .exe como artifact (execução manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ControllerMachine-windows
          path: client/dist/ControllerMachine.exe
